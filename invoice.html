<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاکتور داروها</title>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('assets/fonts/Vazirmatn-Variable.woff2') format('woff2-variations'),
                 url('assets/fonts/Vazirmatn-Variable.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .invoice-container {
            width: 800px;
            flex: none;
            background-color: #ffffff;
            border: 2px solid #000;
            padding: 15px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .header-title {
            text-align: center;
            width: 100%;
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 900;
            color: #000;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .fill-line {
            display: inline-block;
            width: 220px;
                        border-bottom: 1px solid #999;
            margin-right: 5px;
            vertical-align: middle;
            min-height: 1.2em;
            outline: none;
            padding: 0 4px;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .banner {
            border: 3px dotted #000;
            background-color: #e0e0e0;
            background-image: radial-gradient(#888 20%, transparent 20%);
            background-size: 4px 4px;
            padding: 8px 0;
            font-size: 22px;
            font-weight: 900;
            display: block;
            width: 100%;
            text-align: center;
            letter-spacing: 3px;
        }

        .info-boxes {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .box {
            border: 2px solid #000;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .box-title {
            font-weight: 900;
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 3px;
            margin-bottom: 3px;
            font-size: 13px;
        }

        .box-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 4px;
            min-width: 0;
        }

        .box-item span {
            color: #333;
            flex: none;
            white-space: nowrap;
        }

        .box-item strong {
            outline: none;
            min-height: 1.2em;
            min-width: 0;
            flex: 1;
            direction: ltr;
            text-align: left;
            border-bottom: 1px solid transparent;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .box-item strong[contenteditable]:focus {
            border-bottom: 1px solid #000;
            background: #f7f7f7;
        }

        .box-item strong[contenteditable]:empty::before {
            content: attr(data-placeholder);
            color: #bbb;
            font-weight: 400;
        }

        .mini-input, .mini-select {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-weight: 700;
            font-size: 12px;
            border: none;
            border-bottom: 1px solid #999;
            background: transparent;
            color: #000;
            outline: none;
            direction: ltr;
            text-align: left;
            padding: 0 2px;
        }
        .mini-input:focus, .mini-select:focus {
            border-bottom: 1px solid #000;
            background: #f7f7f7;
        }
        .mini-input.invalid {
            border-bottom: 2px solid #c0392b;
            color: #c0392b;
            background: #fdecea;
        }
        .wide-input { width: 130px; }
        .age-wrap, .date-wrap, .time-wrap {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .age-input { width: 34px; }
        .unit-suffix { font-weight: 700; }
        .date-y { width: 42px; }
        .date-md { width: 26px; }
        .time-input { width: 48px; }
        .mini-select { width: 52px; cursor: pointer; }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .items-table {
            width: 100%;
            min-width: 560px;
            border-collapse: collapse;
            border: 2px solid #000;
            table-layout: fixed;
        }

        .items-table th, .items-table td {
            border: 1px solid #000;
            padding: 8px 5px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .items-table th {
            background-image: radial-gradient(#000 20%, transparent 20%);
            background-size: 4px 4px;
            background-color: #d0d0d0;
            font-size: 14px;
        }

        .items-table td {
            height: 40px;
        }

        .items-table td[contenteditable] {
            outline: none;
        }

        .items-table td[contenteditable]:focus {
            background: #f7f7f7;
        }

        .items-table td .mini-input {
            width: 100%;
            font-size: 13px;
            text-align: center;
            padding: 2px;
        }

        .drug-name-cell {
            text-align: right;
            padding-right: 10px;
        }

        .row-total-cell {
            font-weight: 900;
        }

        .bottom-section {
            border-top: 2px solid #000;
            padding-top: 15px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .total-box {
            border: 3px double #000;
            background-color: #d0d0d0;
            background-image: radial-gradient(#888 20%, transparent 20%);
            background-size: 4px 4px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            border-top: 1px solid #000;
            padding-top: 10px;
            margin-top: 15px;
            color: #555;
        }

        .toolbar {
            width: 800px;
            flex: none;
            margin: 0 auto 12px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .toolbar button {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .toolbar .btn-print {
            background-color: #0f6e5c;
            color: #fff;
        }

        .mini-input:not(:placeholder-shown),
        .fill-line:not(:empty),
        .box-item strong[contenteditable]:not(:empty) {
            border-bottom-color: transparent;
        }

        @page { size: A5; margin: 8mm; }

        @media print {
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            html, body { background: #fff; }
            body { padding: 0; min-height: 0; display: block; height: auto; }
            .invoice-container { break-inside: avoid; page-break-inside: avoid; }
            .invoice-container { box-shadow: none; border: 2px solid #000; width: auto; padding: 8px; }
            .toolbar { display: none; }
            .table-scroll { overflow: visible; }
            .items-table { min-width: 0; }
            .items-table td { height: 24px; padding: 2px 4px; font-size: 11px; }
            .items-table th { padding: 4px; font-size: 11px; }
            .items-table td .mini-input { font-size: 11px; padding: 0 2px; }
            .banner { font-size: 18px; padding: 5px 0; }
            .header-title h1 { font-size: 22px; }
            .bottom-section { padding-top: 8px; margin-top: 4px; }
            .total-box { font-size: 15px; padding: 6px 14px; }
            .footer-text { margin-top: 8px; padding-top: 6px; font-size: 11px; }
            .items-table tr { break-inside: avoid; }
            .box-item strong[contenteditable]:empty::before { content: ""; }
            .fill-line:empty::before { content: ""; }
            .fill-line, .mini-input, .mini-select, .box-item strong { border-bottom-color: transparent !important; }
            input, select, [contenteditable] { background: transparent !important; }
            input::placeholder { color: transparent !important; }
            input, select { -webkit-appearance: none; appearance: none; }
            .mini-input.invalid { color: #000; background: transparent !important; }
            ::selection { background: transparent !important; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button type="button" class="btn-print" id="print-btn">چاپ / PDF</button>
    </div>

    <div class="invoice-container" id="invoice-container">
        <div class="header">
            <div class="header-title">
                <h1>داروخانه <span class="fill-line" contenteditable="true" data-placeholder="نام داروخانه"></span></h1>
                <div class="banner">فاکتــــــور داروهــــــا</div>
            </div>
        </div>

        <div class="info-boxes">
            <div class="box">
                <div class="box-title">مشخصات بیمار</div>
                <div class="box-item"><span>نام بیمار :</span> <strong contenteditable="true" data-placeholder="............."></strong></div>
                <div class="box-item age-row"><span>سن بیمار :</span> <span class="age-wrap"><input type="text" inputmode="numeric" maxlength="3" id="patient-age" class="mini-input age-input" placeholder="..."><span class="unit-suffix">سال</span></span></div>
                <div class="box-item"><span>کد ملی :</span> <input type="text" inputmode="numeric" maxlength="10" id="national-id" class="mini-input wide-input" placeholder="..........."></div>
                <div class="box-item"><span>شماره تماس :</span> <input type="text" inputmode="numeric" maxlength="11" id="phone-number" class="mini-input wide-input" placeholder="..........."></div>
            </div>

            <div class="box">
                <div class="box-title">اطلاعات نسخه</div>
                <div class="box-item"><span>نام دکتر :</span> <strong contenteditable="true" data-placeholder="............."></strong></div>
                <div class="box-item"><span>بیماری/تشخیص :</span> <strong contenteditable="true" data-placeholder="............."></strong></div>
                <div class="box-item date-row">
                    <span>تاریخ :</span>
                    <span class="date-wrap">
                        <input type="text" inputmode="numeric" maxlength="4" id="date-year" class="mini-input date-y" placeholder="سال">/<input type="text" inputmode="numeric" maxlength="2" id="date-month" class="mini-input date-md" placeholder="ماه">/<input type="text" inputmode="numeric" maxlength="2" id="date-day" class="mini-input date-md" placeholder="روز">
                    </span>
                </div>
                <div class="box-item time-row">
                    <span>ساعت :</span>
                    <span class="time-wrap">
                        <input type="text" inputmode="numeric" maxlength="5" id="time-value" class="mini-input time-input" placeholder="۰۰:۰۰">
                        <select id="time-ampm" class="mini-select">
                            <option value="ق.ظ">ق.ظ</option>
                            <option value="ب.ظ">ب.ظ</option>
                        </select>
                    </span>
                </div>
            </div>
        </div>

        <div class="table-scroll">
            <table class="items-table">
                <thead>
                    <tr>
                        <th style="width: 8%;">ردیف</th>
                        <th style="width: 45%;">شرح دارو</th>
                        <th style="width: 10%;">تعداد</th>
                        <th style="width: 17%;">قیمت واحد (ریال)</th>
                        <th style="width: 20%;">مبلغ کل (ریال)</th>
                    </tr>
                </thead>
                <tbody id="items-body"></tbody>
            </table>
        </div>

        <div class="bottom-section">
            <div class="total-box">
                <span>مبلغ کل قابل پرداخت :</span>
                <strong id="grand-total">۰ ریال</strong>
            </div>
        </div>

        <div class="footer-text">
            با تشکر از مراجعه شما. بهبودی شما آرزوی ماست.
        </div>
    </div>

<script src="invoice.js"></script>
</body>
</html>
